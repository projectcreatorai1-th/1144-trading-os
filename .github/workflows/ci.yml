name: CI

# 1144 Trading OS — architecture validator + full pytest suite.
# Only third-party dependency: PyYAML (see pyproject.toml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # core stays zero-dependency; PyYAML feeds the architecture
        # validator, pytest runs the suite, websockets backs the real
        # WebSocket transport test (Phase M gateway e2e)
        run: pip install "PyYAML>=6.0" "pytest>=7" "websockets>=12"
      - name: "Architecture validator (SSOT: architecture/architecture.yaml)"
        run: python -m architecture.validator
      - name: Gateway contract sanity (server line 1.0.0)
        run: |
          python - <<'PY'
          import re
          src = open("platform/gateway/contracts.py", encoding="utf-8").read()
          m = re.search(r'^CONTRACT_VERSION\s*=\s*"([^"]+)"', src, re.M)
          assert m and m.group(1) == "1.0.0", f"gateway CONTRACT_VERSION={m and m.group(1)!r}"
          print("gateway server contract: 1.0.0 OK")
          PY
      - name: Full test suite
        # console entry point (NOT `python -m pytest`): keeps the repo root off
        # sys.path[0] while pytest itself imports, so the stdlib `platform`
        # module resolves normally; conftest then swaps in the project package.
        run: pytest -q
