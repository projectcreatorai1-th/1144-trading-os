rules_index:
- rule: '001'
  statement: Single Source of Truth
  enforced_by:
  - SOT-001
  - SOT-003
- rule: '002'
  statement: No duplicated business logic across modules
  enforced_by:
  - SOT-002
- rule: '003'
  statement: No parallel calculation systems
  enforced_by:
  - SOT-002
- rule: '004'
  statement: GUI must not compute business logic
  enforced_by:
  - ARCH-006
  - IMPORT-001
- rule: '005'
  statement: GUI must not access the database directly
  enforced_by:
  - ARCH-006
  - GF-002
- rule: '006'
  statement: AI must not connect to broker/MT5 directly
  enforced_by:
  - ARCH-006
  - GF-003
- rule: '007'
  statement: AI must not bypass the Policy Engine
  enforced_by:
  - ARCH-006
  - RISK-GATE
- rule: 008
  statement: AI must not bypass the Risk Engine
  enforced_by:
  - RISK-GATE
- rule: 009
  statement: No order enters execution without a valid risk decision
  enforced_by:
  - RISK-GATE
- rule: '010'
  statement: UNKNOWN must never be interpreted as SAFE
  enforced_by:
  - RISK-GATE
  - ENV-001
- rule: '011'
  statement: Missing data must not be interpreted as no-risk
  enforced_by:
  - RISK-GATE
- rule: '012'
  statement: Environments are strictly separated
  enforced_by:
  - ENV-001
  - ENV-002
- rule: '013'
  statement: No mock/fake/placeholder in the production path
  enforced_by:
  - NOPRODUCTION-001
- rule: '014'
  statement: No TODO hiding functionality
  enforced_by:
  - NOPRODUCTION-001
- rule: '015'
  statement: Contract changes require a version bump
  enforced_by:
  - SCHEMA-002
  - SCHEMA-003
- rule: '016'
  statement: Breaking changes detected by automated tests
  enforced_by:
  - SCHEMA-002
- rule: '017'
  statement: Decisions traceable to sources/events
  enforced_by:
  - TRACE-001
- rule: 018
  statement: Events link into causal chains
  enforced_by:
  - TRACE-002
- rule: 019
  statement: System fails closed on unclear validation/risk state
  enforced_by:
  - RISK-GATE
  - SM-004
  - ENV-001
- rule: '020'
  statement: Architecture ambiguity stops work (gap procedure)
  enforced_by:
  - docs/phase-0-report.md
