system:
  name: 1144 Trading OS
  phase: 10
  system_version: 1.1.0
  architecture_version: 1.10.0
  contract_version: 1.10.0
  schema_version: 1.10.0
  source_of_truth: architecture/architecture.yaml
  description: Contract-first trading operating system. Phase 0 defines architecture,
    registries and versioned contracts only. No execution, no broker connection, no
    AI behavior, no GUI beyond contract scope.
layers:
- name: contracts_kernel
  order: 0
  description: Shared contract kernel. Depended on by all; depends on no application
    module.
- name: ui
  order: 1
  description: User interfaces. May only talk to the API layer and the kernel.
- name: api
  order: 2
  description: Application/API layer between UI and Core.
- name: core
  order: 3
  description: Domain core (business logic, contracts, decisions, risk).
- name: infrastructure
  order: 4
  description: Platform infrastructure and external adapters. May implement core-owned
    ports (dependency inversion), declared via 'implements'.
dependency_policy:
  direction_rule: 'A module at layer L may depend only on: (a) the shared kernel (architecture.contracts),
    (b) modules at layers with a strictly greater order, (c) modules in its own allowed_dependencies
    list. Same-layer dependencies require an explicit allow-list entry.'
  implementation_exception: An infrastructure module may depend on a core module ONLY
    when it declares that core module's port in 'implements' (dependency inversion
    for port implementations).
  global_forbidden:
  - rule: GF-001
    description: No module outside the ui domain may depend on ui.*
    pattern: ui.*
    applies_to_all_except:
    - ui.desktop
    - ui.web
  - rule: GF-002
    description: GUI must never depend on database, event bus or adapters directly
      (RULE 005)
    modules:
    - ui.desktop
    - ui.web
    forbidden:
    - platform.database
    - platform.event_bus
    - platform.cache
    - platform.scheduler
    - adapters.mt5
    - adapters.broker
    - adapters.market_data
    - adapters.news
    - adapters.calendar
    - adapters.ai
    - adapters.alternative_data
  - rule: GF-003
    description: AI must never depend on broker or MT5 directly (RULE 006)
    modules:
    - adapters.ai
    forbidden:
    - adapters.mt5
    - adapters.broker
  - rule: GF-004
    description: Strategy must never depend on broker/MT5 adapters directly (goes
      through execution + policy/risk)
    modules:
    - core.strategy
    forbidden:
    - adapters.broker
    - adapters.mt5
    - adapters.market_data
  - rule: GF-005
    description: Core business logic must never depend on GUI frameworks
    modules:
    - core.data
    - core.time
    - core.events
    - core.intelligence
    - core.research
    - core.strategy
    - core.decision
    - core.policy
    - core.risk
    - core.portfolio
    - core.execution
    - core.reconciliation
    - core.ledger
    - core.validation
    forbidden:
    - ui.desktop
    - ui.web
  - rule: GF-006
    description: Execution must not consume AI adapters directly; AI output enters
      via decision/policy/risk chain
    modules:
    - core.execution
    forbidden:
    - adapters.ai
    - adapters.news
    - adapters.calendar
environments:
  supported:
  - RESEARCH
  - SIMULATION
  - REPLAY
  - PAPER
  - DEMO
  - LIVE
  - BACKTEST
  mismatch_policy: FAIL_CLOSED
  transition_registry: architecture/state-machines.yaml#environment
  isolation_rules:
  - An object created in one environment can never be executed in another without
    an explicit validated transition.
  - Simulation/paper/research orders must never reach a live broker.
  - 'BACKTEST is a research-only environment: backtest orders never reach any external
    broker.'
modules:
- id: architecture.contracts
  layer: contracts_kernel
  domain: architecture
  status: ACTIVE
  responsibility:
  - define shared contract kernel (identifiers, time, environment, versioning, provenance,
    causality, schema engine, state machine engine, config envelope)
  - define base contract error taxonomy (fail-closed errors)
  allowed_dependencies: []
  forbidden_dependencies:
  - core.*
  - platform.*
  - adapters.*
  - ui.*
  - research
  - tests
  contracts:
  - environment
  - provenance
  - config
- id: architecture.validator
  layer: contracts_kernel
  domain: architecture
  status: ACTIVE
  responsibility:
  - validate project structure, registries and source dependencies against the architecture
    registry
  allowed_dependencies:
  - architecture.contracts
  forbidden_dependencies:
  - core.*
  - platform.*
  - adapters.*
  - ui.*
  - research
  contracts: []
- id: core.data
  layer: core
  domain: core
  status: ACTIVE
  responsibility:
  - own market data ingestion and normalization contract
  - own raw data store, data source registry, lineage, deduplication and sequencing
    for the data pipeline
  allowed_dependencies:
  - architecture.contracts
  - core.time
  - core.events
  - core.validation
  forbidden_dependencies:
  - ui.desktop
  - ui.web
  - adapters.mt5.direct_execution
  contracts:
  - raw_data
  - normalized_data
  - data_source
  - lineage_record
- id: core.time
  layer: core
  domain: core
  status: ACTIVE
  responsibility:
  - own the time contract (timezone-aware timestamps, timestamp types, clocks, latency
    measurement)
  - own time validation (invalid vs late vs out-of-order), timestamp anomaly detection
    and event ordering
  allowed_dependencies:
  - architecture.contracts
  forbidden_dependencies:
  - ui.desktop
  - ui.web
  contracts:
  - latency_report
- id: core.events
  layer: core
  domain: core
  status: ACTIVE
  responsibility:
  - own the event contract (event types, event envelope, event repository port)
  allowed_dependencies:
  - architecture.contracts
  - core.time
  forbidden_dependencies:
  - ui.desktop
  - ui.web
  contracts:
  - event
- id: core.intelligence
  layer: core
  domain: core
  status: ACTIVE
  responsibility:
  - 'own the intelligence plane (Phase 7): point-in-time features, immutable
    intelligence datasets, labels, model registry/content identity, training,
    evaluation, validation gate, deterministic inference, AI safety gate,
    explainability, drift/OOD, model health, advisory AI outputs, proposals,
    model lifecycle, replay/diff and incidents'
  - 'AI is advisory/proposal intelligence only: it never holds risk,
    execution, policy, permission or portfolio authority (architecture rules
    AI-001..AI-036)'
  allowed_dependencies:
  - architecture.contracts
  - core.data
  - core.events
  - core.time
  - core.validation
  - core.research
  - platform.audit
  - platform.security
  forbidden_dependencies:
  - ui.desktop
  - ui.web
  - adapters.mt5
  - adapters.broker
  - adapters.simulation
  - core.oms
  - core.ems
  - core.execution
  - core.risk
  - core.policy
  - core.portfolio
  - core.strategy
  - core.decision
  - core.backtest
  - core.ledger
  - core.state
  - core.reconciliation
  - core.intelligence
  contracts:
  - feature_definition
  - feature_snapshot
  - intelligence_dataset
  - label_definition
  - training_config
  - training_run
  - model_definition
  - model_evaluation
  - model_validation
  - inference_request
  - inference_result
  - ai_observation
  - ai_prediction
  - ai_recommendation
  - ai_proposal
  - ai_signal
  - model_health
  - drift_report
  - explanation
  - model_replay
  - model_selection
  - model_card
  - ai_incident
- id: core.security
  layer: core
  domain: core
  status: ACTIVE
  responsibility:
  - 'own the security guardrail plane (Phase 8): authentication, sessions,
    credentials, secrets, key management, canonical authorization (DELEGATES
    to platform.security RBAC - never a second permission source), maker-
    checker approvals, request/replay/idempotency protection, rate limiting,
    security events, audit tamper evidence, encryption policy, backup and
    restore integrity, security incidents and security observability'
  - 'security guards the authority chain; it never replaces Policy, Risk,
    Strategy eligibility, Portfolio, OMS or EMS (never converts BLOCK to
    ALLOW)'
  allowed_dependencies:
  - architecture.contracts
  - core.events
  - core.time
  - core.validation
  - platform.security
  - platform.audit
  forbidden_dependencies:
  - ui.desktop
  - ui.web
  - adapters.mt5
  - adapters.broker
  - core.oms
  - core.ems
  - core.execution
  - core.risk
  - core.policy
  - core.portfolio
  - core.strategy
  - core.intelligence
  - core.backtest
  - core.research
  - core.ledger
  - core.state
  - core.governance
  contracts:
  - security_credential
  - security_session
  - security_key
  - security_secret_reference
  - security_approval
  - security_request
  - security_incident
  - backup_manifest
  - rate_limit_decision
  - encryption_policy
- id: core.governance
  layer: core
  domain: core
  status: ACTIVE
  responsibility:
  - 'own the governance control plane (Phase 8): maker-checker governed
    lifecycle of privileged artifacts (policy, risk config, strategy, model,
    security configuration) through the GovernanceGate - WHO/WHAT/WHEN/WHY/
    OLD/NEW/APPROVAL/EVIDENCE for every privileged transition'
  - 'governance wraps existing lifecycles (Phase 3/4/7); it creates no
    second policy/strategy/model lifecycle engine'
  allowed_dependencies:
  - architecture.contracts
  - core.events
  - core.time
  - core.validation
  - core.security
  - platform.security
  - platform.audit
  forbidden_dependencies:
