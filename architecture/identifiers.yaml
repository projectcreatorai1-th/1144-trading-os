- kind: feature_snapshot_id
  prefix: fsn
  description: Feature snapshot identifier (Phase 7)
- kind: intelligence_dataset_id
  prefix: ids
  description: Intelligence dataset identifier (Phase 7)
- kind: label_definition_id
  prefix: lbl
  description: Label definition identifier (Phase 7)
- kind: training_run_id
  prefix: trg
