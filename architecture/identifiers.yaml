  description: Risk context identifier (Phase 3)
- kind: risk_budget_id
  prefix: rgb
  description: Risk budget identifier (Phase 3)
- kind: intent_id
  prefix: itt
  description: Strategy intent identifier (Phase 4)
- kind: strategy_evaluation_id
  prefix: sev
  description: Strategy evaluation identifier (Phase 4)
- kind: portfolio_id
  prefix: ptf
  description: Portfolio identifier (Phase 4)
- kind: capital_allocation_id
  prefix: alc
  description: Capital allocation identifier (Phase 4)
- kind: portfolio_decision_id
  prefix: pdc
  description: Portfolio decision identifier (Phase 4)
- kind: capability_profile_id
  prefix: cap
  description: Capability profile identifier (Phase 4)
- kind: outbox_message_id
  prefix: obx
  description: Durable outbox message identifier (Phase 5)
- kind: dataset_id
  prefix: dts
  description: Research dataset identifier (Phase 6)
- kind: research_run_id
  prefix: rsr
  description: Research run identifier (Phase 6)
- kind: research_result_id
