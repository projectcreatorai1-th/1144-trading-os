standard:
  format: '{prefix}_{uuid4hex}'
  regex: ^[a-z]{3}_[0-9a-f]{32}$
  generation: uuid4
  case: lower
  version: 1.11.0
identifiers:
- kind: gateway_session_id
  prefix: gss
  description: SNIPER Gateway server session identifier (platform.gateway)
- kind: alert_id
  prefix: alr
  description: Observability alert identifier (platform.monitoring, Phase 11)
- kind: operational_incident_id
  prefix: inc
  description: Operational incident identifier (platform.incident, Phase 12)
- kind: event_id
  prefix: evt
  description: Domain event identifier
- kind: decision_id
  prefix: dec
  description: Trading decision identifier
- kind: policy_id
  prefix: pol
  description: Policy identifier
- kind: risk_decision_id
  prefix: rsk
  description: Risk decision identifier
- kind: order_id
  prefix: ord
  description: Order identifier
- kind: execution_id
  prefix: exe
  description: Execution (fill) identifier
- kind: position_id
  prefix: pos
  description: Position identifier
- kind: ledger_entry_id
  prefix: ldg
  description: Ledger entry identifier
- kind: audit_id
  prefix: aud
  description: Audit record identifier
- kind: request_id
  prefix: req
  description: API request identifier
- kind: correlation_id
  prefix: cor
  description: Correlation identifier grouping one causal chain
- kind: causation_id
  prefix: cau
  description: Identifier of the direct cause of an event
- kind: session_id
  prefix: ssn
  description: Session identifier
- kind: strategy_id
  prefix: str
  description: Strategy identifier
- kind: model_id
  prefix: mdl
  description: AI/quant model identifier
- kind: model_version_id
  prefix: mdv
  description: Model version identifier
- kind: config_id
  prefix: cfg
  description: Configuration identifier
- kind: user_id
  prefix: usr
  description: User identity identifier
- kind: raw_id
  prefix: raw
  description: Raw ingested data record identifier (Phase 1)
- kind: normalized_id
  prefix: nrm
  description: Normalized data record identifier (Phase 1)
- kind: lineage_id
  prefix: lin
  description: Lineage record identifier (Phase 1)
- kind: ingestion_id
  prefix: ing
  description: Ingestion batch identifier (Phase 1)
- kind: state_id
  prefix: stt
  description: State record identifier (Phase 2)
- kind: snapshot_id
  prefix: snp
  description: State snapshot identifier (Phase 2)
- kind: transition_id
  prefix: trn
  description: State transition identifier (Phase 2)
- kind: observation_id
  prefix: obs
  description: External observation identifier (Phase 2)
- kind: reconciliation_id
  prefix: rec
  description: Reconciliation run identifier (Phase 2)
- kind: policy_evaluation_id
  prefix: pev
  description: Policy evaluation identifier (Phase 3)
- kind: risk_context_id
