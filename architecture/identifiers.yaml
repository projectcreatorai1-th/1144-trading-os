- kind: connection_id
  prefix: cnn
  description: Broker/feed connection identifier (Phase 10)
- kind: feed_provider_id
  prefix: fdv
  description: Market data feed provider identifier (Phase 10)
special_rules:
- event.causation_id must be either None (chain root) or a valid event_id (evt_ prefix).
- event.correlation_id may carry any identifier kind; it must remain identical along
  one causal chain.
- IDs are immutable; a new logical object always receives a new id.
