schema_id: ai_incident
version: 1.0.0
status: ACTIVE
owner: core.intelligence
description: AI incident record preserving evidence (Phase 7)
python_binding: core.intelligence.outputs:AIIncident
fields:
  ai_incident_id:
    type: string
    required: true
  incident_type:
    type: string
    required: true
  model_hash:
    type: string
    required: true
  detected_at:
    type: timestamp
    required: true
  environment:
    type: string
    required: true
  evidence:
    type: object
    required: true
  status:
    type: string
    required: true
  description:
    type: string
    required: true
  resolved_at:
    type: timestamp
    required: false
  schema_version:
    type: string
    required: false
enums: {}
constraints:
- Incidents preserve evidence; retirement/deletion never removes historical outputs.
compatibility: BACKWARD
history:
- version: 1.0.0
  date: '2026-09-24'
  summary: Initial ai_incident contract (Phase 7)
  changes: []
