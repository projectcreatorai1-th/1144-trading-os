schema_id: api_response
version: "1.0.0"
status: ACTIVE
owner: platform.api
description: "API response contract. Errors carry structured codes; responses carry contract versions."
python_binding: "platform.api.contracts:APIResponse"

fields:
  request_id: { type: identifier, required: true, description: "req_ identifier of the originating request" }
  correlation_id: { type: string, required: true, description: "Chain correlation identifier" }
  status: { type: string, required: true, enum: api_status, description: "OK or ERROR" }
  data: { type: object, required: false, description: "Response payload on success" }
  error_code: { type: string, required: false, enum: api_error_code, description: "Structured error code on failure" }
  error_message: { type: string, required: false, description: "Human-readable error message" }
  response_time: { type: timestamp, required: true, description: "Response time" }
  environment: { type: string, required: true, description: "Explicit environment" }
  contract_versions: { type: object, required: true, description: "Contract versions used to build the response" }
  contract_version: { type: semver, required: false, description: "Contract version carried by the instance" }

enums:
  api_status: [OK, ERROR]
  api_error_code: [VALIDATION_ERROR, PERMISSION_DENIED, NOT_FOUND, ENVIRONMENT_MISMATCH, CONTRACT_VIOLATION, RATE_LIMITED, INTERNAL_ERROR]

constraints:
  - "status ERROR requires error_code; status OK must not carry one."
  - "contract_versions MUST at least include the responding contract's version."

compatibility: BACKWARD
history:
  - version: "1.0.0"
    date: "2026-09-23"
    summary: "Initial api_response contract"
    changes: []
