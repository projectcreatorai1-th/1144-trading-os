schema_id: data_quality
version: "1.1.0"
status: ACTIVE
owner: core.validation
description: "Data quality report referenced by risk decisions. UNKNOWN never means safe (RULE 010/011)."
python_binding: "core.validation.contracts:DataQualityReport"

fields:
  level: { type: string, required: true, enum: data_quality_level, description: "Data quality level" }
  checked_at: { type: timestamp, required: true, description: "Assessment time" }
  missing_fields: { type: array, required: false, description: "Fields found missing during checks" }
  stale_data: { type: boolean, required: false, description: "Whether referenced data was stale" }
  details: { type: object, required: false, description: "Additional check details" }

enums:
  data_quality_level: [VERIFIED, VALIDATED, DEGRADED, STALE, INVALID, UNKNOWN]

constraints:
  - "level UNKNOWN or DEGRADED with missing critical fields must lead risk to BLOCK, not to proceed."
  - "level STALE and INVALID (added 1.1.0) also block risk allowance; UNKNOWN never means safe."
  - "checked_at MUST be timezone-aware."

compatibility: BACKWARD
history:
  - version: "1.0.0"
    date: "2026-09-23"
    summary: "Initial data quality contract"
    changes: []
  - version: "1.1.0"
    date: "2026-09-23"
    summary: "Phase 1 quality classification: STALE and INVALID states"
    changes:
      - { kind: ADDED_ENUM_VALUE, enum: data_quality_level, value: STALE }
      - { kind: ADDED_ENUM_VALUE, enum: data_quality_level, value: INVALID }
