schema_id: environment
version: 1.1.0
status: ACTIVE
owner: architecture.contracts
description: Environment declaration contract. Environments are an explicit enum;
  mismatches fail closed (SECTION 18).
python_binding: architecture.contracts.environment:EnvironmentDeclaration
fields:
  environment:
    type: string
    required: true
    enum: environment
    description: Environment enum value
  declared_by:
    type: string
    required: true
    description: Module/process declaring this environment
  declared_at:
    type: timestamp
    required: true
    description: Declaration time
  capabilities:
    type: array
    required: false
    description: Capabilities active in this environment
  restrictions:
    type: array
    required: false
    description: Restrictions active in this environment
  contract_version:
    type: semver
    required: false
    description: Contract version carried by the instance
enums:
  environment:
  - RESEARCH
  - SIMULATION
  - REPLAY
  - PAPER
  - DEMO
  - LIVE
  - BACKTEST
constraints:
- Environment mismatch between two objects in the execution path is a hard failure.
- RESEARCH/SIMULATION/REPLAY/PAPER objects may NEVER reach LIVE execution without
  an explicit validated transition.
compatibility: BACKWARD
history:
- version: 1.0.0
  date: '2026-09-23'
  summary: Initial environment contract
  changes: []
- version: 1.1.0
  date: '2026-09-24'
  summary: 'Phase 6: BACKTEST research-only environment'
  changes:
  - kind: ADDED_ENUM_VALUE
    enum: environment
    value: BACKTEST
