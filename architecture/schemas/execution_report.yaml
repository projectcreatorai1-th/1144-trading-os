schema_id: execution_report
version: 1.0.0
status: ACTIVE
owner: core.oms
description: execution_report contract (Phase 5)
python_binding: core.oms.contracts:ExecutionReport
fields:
  execution_id:
    type: identifier
    required: true
  order_id:
    type: identifier
    required: true
  environment:
    type: string
    required: true
  execution_type:
    type: string
    required: true
    enum: execution_type
  status:
    type: string
    required: true
    enum: execution_status
  symbol:
    type: string
    required: true
  side:
    type: string
    required: true
    enum: execution_side
  executed_quantity:
    type: string
    required: true
    description: canonical decimal string
  execution_price:
    type: string
    required: true
    description: canonical decimal string
  currency:
    type: string
    required: true
  broker_order_id:
    type: string
    required: false
  fees:
    type: string
    required: false
    description: canonical decimal string
  commission:
    type: string
    required: false
    description: canonical decimal string
  swap:
    type: string
    required: false
    description: canonical decimal string
  broker_timestamp:
    type: timestamp
    required: true
  received_at:
    type: timestamp
    required: true
  provenance:
    type: object
    required: true
  raw_reference:
    type: string
    required: true
  idempotency_key:
    type: string
    required: true
    description: deterministic per broker fill reference
  correction_of:
    type: identifier
    required: false
    description: linked correction entry (Phase 2 pattern)
  normalized_error:
    type: string
    required: false
    description: Canonical broker error taxonomy value (raw evidence preserved in
      provenance)
enums:
  execution_type:
  - FILL
  - PARTIAL_FILL
  - CANCEL
  - REJECT
  - CORRECTION
  - STATUS
  execution_status:
  - CONFIRMED
  - REJECTED
  - UNKNOWN
  execution_side:
  - BUY
  - SELL
constraints:
- Immutable; corrections are linked CORRECTION reports (never edits).
- RAW broker response is preserved via provenance.raw before normalization.
- Sum of executed_quantity per order MUST NOT exceed requested quantity (overfill
  protection).
compatibility: BACKWARD
history:
- version: 1.0.0
  date: '2026-09-24'
  summary: Initial execution_report contract (Phase 5)
  changes: []
