schema_id: explanation
version: 1.0.0
status: ACTIVE
owner: core.intelligence
description: Explainability contract - correlation is never causation (Phase 7)
python_binding: core.intelligence.outputs:Explanation
fields:
  explanation_id:
    type: string
    required: true
  explanation_type:
    type: string
    required: true
  model_ref:
    type: string
    required: true
  model_version:
    type: string
    required: true
  input_feature_hash:
    type: string
    required: true
  method:
    type: string
    required: true
  generated_at:
    type: timestamp
    required: true
  environment:
    type: string
    required: true
  status:
    type: string
    required: true
  limitations:
    type: string
    required: true
  evidence:
    type: object
    required: false
  inference_ref:
    type: string
    required: false
  schema_version:
    type: string
    required: false
enums: {}
constraints:
- Feature-contribution explanations must state they are not causal.
- Unavailable explanations are EXPLANATION_UNAVAILABLE, never fabricated text.
compatibility: BACKWARD
history:
- version: 1.0.0
  date: '2026-09-24'
  summary: Initial explanation contract (Phase 7)
  changes: []
