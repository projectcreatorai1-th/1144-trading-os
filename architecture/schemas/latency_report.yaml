schema_id: latency_report
version: "1.0.0"
status: ACTIVE
owner: core.time
description: "Latency metrics. Missing timestamps produce UNKNOWN (null), never guessed values."
python_binding: "core.time.latency:LatencyReport"

fields:
  measured_at: { type: timestamp, required: true, description: "Measurement time" }
  ingestion_latency_ms: { type: number, required: false, description: "received_time - event_time; null = UNKNOWN" }
  processing_latency_ms: { type: number, required: false, description: "processed_time - received_time; null = UNKNOWN" }
  end_to_end_latency_ms: { type: number, required: false, description: "processed_time - event_time; null = UNKNOWN" }
  event_id: { type: string, required: false, description: "Related event identifier" }
  correlation_id: { type: string, required: false, description: "Chain correlation identifier" }
  anomalies: { type: array, required: false, description: "Detected latency anomalies (negative or large latency)" }

enums: {}

constraints:
  - "A latency metric without both required timestamps MUST be null (UNKNOWN), never an estimate."
  - "Negative latency is impossible; when clock inconsistencies produce one, the metric is null and an anomaly is recorded."

compatibility: BACKWARD
history:
  - version: "1.0.0"
    date: "2026-09-23"
    summary: "Initial latency report contract (Phase 1)"
    changes: []
