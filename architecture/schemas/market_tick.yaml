schema_id: market_tick
version: "1.0.0"
status: ACTIVE
owner: core.data
description: "Market data tick payload. Carried as data only - no trading interpretation in Phase 1."
python_binding: null

fields:
  symbol: { type: string, required: true, description: "Trade symbol (structural format only)" }
  bid: { type: string, required: true, description: "Bid price as decimal string" }
  ask: { type: string, required: true, description: "Ask price as decimal string" }
  bid_size: { type: string, required: false, description: "Bid size as decimal string" }
  ask_size: { type: string, required: false, description: "Ask size as decimal string" }
  source_event_ref: { type: string, required: false, description: "Provider-side event reference (dedup input)" }
  sequence_number: { type: integer, required: false, description: "Provider sequence number when the stream supports it" }

enums: {}

constraints:
  - "symbol must be well formed (uppercase letters, digits and . / _ -)."
  - "Prices are decimal strings; no precision is guessed or rounded in Phase 1."

compatibility: BACKWARD
history:
  - version: "1.0.0"
    date: "2026-09-23"
    summary: "Initial market tick payload schema (Phase 1)"
    changes: []
