schema_id: model_card
version: 1.0.0
status: ACTIVE
owner: core.intelligence
description: Immutable model card (Phase 7)
python_binding: core.intelligence.outputs:ModelCard
fields:
  model_hash:
    type: string
    required: true
  purpose:
    type: string
    required: true
  intended_use:
    type: string
    required: true
  prohibited_use:
    type: string
    required: true
  training_data_ref:
    type: string
    required: true
  feature_set:
    type: array
    required: true
  limitations:
    type: string
    required: true
  metrics:
    type: object
    required: true
  oos_summary:
    type: object
    required: true
  robustness_summary:
    type: object
    required: true
  known_failure_cases:
    type: array
    required: true
  uncertainty_summary:
    type: object
    required: true
  drift_baseline:
    type: object
    required: true
  environment:
    type: string
    required: true
  model_version:
    type: string
    required: true
  provenance:
    type: object
    required: true
  card_hash:
    type: string
    required: true
  created_at:
    type: timestamp
    required: true
  schema_version:
    type: string
    required: false
enums: {}
constraints:
- Model cards are immutable and content-hashed.
