schema_id: model_evaluation
version: 1.0.0
status: ACTIVE
owner: core.intelligence
description: Deterministic versioned evaluation evidence (Phase 7)
python_binding: core.intelligence.contracts:ModelEvaluation
fields:
  model_evaluation_id:
    type: string
    required: true
  model_hash:
    type: string
    required: true
  dataset_hash:
    type: string
    required: true
  task_type:
    type: string
    required: true
  metrics:
    type: object
    required: true
  metrics_version:
    type: string
    required: true
  calibration:
    type: object
    required: true
  confidence_distribution:
    type: object
    required: true
  uncertainty_summary:
    type: object
    required: true
  stability:
    type: object
    required: true
  coverage:
    type: object
    required: true
  created_at:
    type: timestamp
    required: true
  environment:
    type: string
    required: true
  evidence_hash:
    type: string
    required: true
  schema_version:
    type: string
    required: false
enums: {}
constraints:
- Metrics are versioned; no single magic score decides production eligibility.
- Metrics are never fabricated without labels (INSUFFICIENT_LABELS).
compatibility: BACKWARD
history:
- version: 1.0.0
  date: '2026-09-24'
  summary: Initial model_evaluation contract (Phase 7)
  changes: []
