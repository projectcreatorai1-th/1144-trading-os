schema_id: model_replay
version: 1.0.0
status: ACTIVE
owner: core.intelligence
description: Read-only model replay evidence (Phase 7)
python_binding: core.intelligence.outputs:ModelReplay
fields:
  model_replay_id:
    type: string
    required: true
  model_hash:
    type: string
    required: true
  dataset_hash:
    type: string
    required: true
  feature_schema_hash:
    type: string
    required: true
  config_hash:
    type: string
    required: true
  seed:
    type: integer
    required: true
  original_hashes:
    type: array
    required: true
  reproduced_hashes:
    type: array
    required: true
  match:
    type: string
    required: true
  created_at:
    type: timestamp
    required: true
  environment:
    type: string
    required: true
  differences:
    type: object
    required: false
  schema_version:
    type: string
    required: false
enums: {}
constraints:
- Replay is read-only and runs in the REPLAY environment only.
compatibility: BACKWARD
history:
- version: 1.0.0
  date: '2026-09-24'
  summary: Initial model_replay contract (Phase 7)
  changes: []
