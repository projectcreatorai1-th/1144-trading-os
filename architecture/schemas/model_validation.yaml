schema_id: model_validation
version: 1.0.0
status: ACTIVE
owner: core.intelligence
description: Model validation gate evidence checklist (Phase 7)
python_binding: core.intelligence.contracts:ModelValidation
fields:
  model_validation_id:
    type: string
    required: true
  model_hash:
    type: string
    required: true
  evidence:
    type: object
    required: true
  overall:
    type: string
    required: true
  auditor:
    type: string
    required: true
  created_at:
    type: timestamp
    required: true
  environment:
    type: string
    required: true
  notes:
    type: string
    required: false
  schema_version:
    type: string
    required: false
enums: {}
constraints:
- A missing or UNKNOWN critical evidence item forces overall UNKNOWN -> BLOCK.
compatibility: BACKWARD
history:
- version: 1.0.0
  date: '2026-09-24'
  summary: Initial model_validation contract (Phase 7)
  changes: []
