  - kind: ADDED_OPTIONAL_FIELD
    field: idempotency_key
  - kind: ADDED_OPTIONAL_FIELD
    field: expires_at
  - kind: ADDED_OPTIONAL_FIELD
    field: order_version
  - kind: ADDED_OPTIONAL_FIELD
