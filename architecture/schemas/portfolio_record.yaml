schema_id: portfolio_record
version: 1.0.0
status: ACTIVE
owner: core.portfolio
description: portfolio_record contract (Phase 4)
python_binding: core.portfolio.portfolio_contract:Portfolio
fields:
  portfolio_id:
    type: identifier
    required: true
  portfolio_version:
    type: semver
    required: true
  name:
    type: string
    required: true
  account_scope:
    type: string
    required: true
  environment:
    type: string
    required: true
  status:
    type: string
    required: true
    enum: portfolio_status
  base_currency:
    type: string
    required: true
  strategy_members:
    type: array
    required: true
  allocation_policy_id:
    type: string
    required: true
  risk_policy_id:
    type: identifier
    required: false
  created_at:
    type: timestamp
    required: true
  effective_from:
    type: timestamp
    required: true
  effective_to:
    type: timestamp
    required: false
  provenance:
    type: object
    required: false
  schema_version:
    type: semver
    required: false
enums:
  portfolio_status:
  - DRAFT
  - REVIEW
  - APPROVED
  - ACTIVE
  - PAUSED
  - SUSPENDED
  - RETIRED
constraints:
- Versions immutable; semantic change creates a new version.
compatibility: BACKWARD
history:
- version: 1.0.0
  date: '2026-09-24'
  summary: Initial portfolio_record contract (Phase 4)
  changes: []
