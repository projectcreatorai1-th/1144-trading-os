schema_id: security_approval
version: 1.0.0
status: ACTIVE
owner: core.security
description: Maker-checker approval (self-approval unrepresentable)
python_binding: core.security.contracts:ApprovalRecord
fields:
  approval_id:
    type: string
    required: true
  operation:
    type: string
    required: true
  resource:
    type: string
    required: true
  environment:
    type: string
    required: true
  maker_actor_id:
    type: string
    required: true
  checker_actor_id:
    type: string
    required: true
  status:
    type: string
    required: true
  submitted_at:
    type: timestamp
    required: true
  decided_at:
    type: timestamp
    required: false
  reason:
    type: string
    required: false
  evidence:
    type: object
    required: false
  expires_at:
    type: timestamp
    required: false
  schema_version:
    type: string
    required: false
enums: {}
constraints:
- maker_actor_id != checker_actor_id is enforced by the contract.
- Non-human actors (AI) can never approve.
- Only APPROVED/ACTIVE records with a distinct checker grant anything.
compatibility: BACKWARD
history:
- version: 1.0.0
  date: '2026-09-24'
  summary: Initial security_approval contract (Phase 8)
  changes: []
