schema_id: security_credential
version: 1.0.0
status: ACTIVE
owner: core.security
description: Security credential record (verifier-only, no secrets)
python_binding: core.security.contracts:CredentialRecord
fields:
  credential_id:
    type: string
    required: true
  actor_id:
    type: string
    required: true
  status:
    type: string
    required: true
  method:
    type: string
    required: true
  environment:
    type: string
    required: true
  issued_at:
    type: timestamp
    required: true
  expires_at:
    type: timestamp
    required: true
  salt_hex:
    type: string
    required: true
  verifier_hash:
    type: string
    required: true
  version:
    type: integer
    required: true
  rotated_from:
    type: string
    required: false
  revoked_at:
    type: timestamp
    required: false
  revoked_reason:
    type: string
    required: false
  schema_version:
    type: string
    required: false
enums: {}
constraints:
- Only a salted verifier is stored; secrets never persist, log or audit.
- Revoked/expired credentials can never authenticate again.
- Rotation issues a NEW version; old versions never regain authority.
compatibility: BACKWARD
history:
- version: 1.0.0
  date: '2026-09-24'
  summary: Initial security_credential contract (Phase 8)
  changes: []
