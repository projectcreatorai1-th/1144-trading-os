schema_id: state_record
version: 1.1.0
status: ACTIVE
owner: core.state
description: Derived current-state representation. State = what the system believes;
  it is rebuildable from events and always traces to its source event.
python_binding: core.state.contracts:StateRecord
fields:
  state_id:
    type: identifier
    required: true
    description: stt_ identifier
  entity_type:
    type: string
    required: true
    enum: state_category
    description: State category
  entity_id:
    type: string
    required: true
    description: Entity the state belongs to
  state_version:
    type: integer
    required: true
    description: Monotonic version starting at 1
  status:
    type: string
    required: true
    description: Machine state or category status
  payload:
    type: object
    required: true
    description: State payload
  effective_time:
    type: timestamp
    required: true
    description: When the state became true in the world
  observed_time:
    type: timestamp
    required: true
    description: When it was observed
  processed_time:
    type: timestamp
    required: true
    description: When the system processed it
  source_event_id:
    type: identifier
    required: true
    description: evt_ identifier of the event that produced this state
  correlation_id:
    type: string
    required: true
    description: Chain correlation identifier
  environment:
    type: string
    required: true
    description: Explicit environment
  schema_version:
    type: semver
    required: true
    description: State contract version
  causation_id:
    type: string
    required: false
    description: Optional direct cause
enums:
  state_category:
  - SYSTEM_STATE
  - MARKET_STATE
  - DATA_STATE
  - ACCOUNT_STATE
  - ORDER_STATE
  - POSITION_STATE
  - LEDGER_STATE
  - RECONCILIATION_STATE
  - RISK_STATE
constraints:
- processed_time >= observed_time >= effective_time (timezone-aware).
- state must always reference a valid source event (STATE-001).
- Historical state records are immutable (STATE-002).
compatibility: BACKWARD
history:
- version: 1.0.0
  date: '2026-09-23'
  summary: Initial state record contract (Phase 2)
  changes: []
- version: 1.1.0
  date: '2026-09-23'
  summary: 'Phase 3: RISK_STATE category (risk state transitions ride the Phase 2
    state machinery)'
  changes:
  - kind: ADDED_ENUM_VALUE
    enum: state_category
    value: RISK_STATE
