schema_id: state_snapshot
version: 1.1.0
status: ACTIVE
owner: core.state
description: Immutable checkpoint of one entity's state at an event sequence, integrity-verified
  by hash.
python_binding: core.state.contracts:StateSnapshot
fields:
  snapshot_id:
    type: identifier
    required: true
    description: snp_ identifier
  entity_type:
    type: string
    required: true
    enum: state_category
    description: State category
  entity_id:
    type: string
    required: true
    description: Entity the snapshot belongs to
  state_version:
    type: integer
    required: true
    description: State version captured
  event_sequence:
    type: integer
    required: true
    description: Event store sequence the snapshot covers
  event_id:
    type: identifier
    required: true
    description: evt_ identifier of the last applied event
  created_at:
    type: timestamp
    required: true
    description: Snapshot creation time
  state_payload:
    type: object
    required: true
    description: Captured state payload and status
  schema_version:
    type: semver
    required: true
    description: Snapshot contract version
  environment:
    type: string
    required: true
    description: Explicit environment
  hash:
    type: string
    required: true
    description: SHA-256 over the canonical snapshot content
enums:
  state_category:
  - SYSTEM_STATE
  - MARKET_STATE
  - DATA_STATE
  - ACCOUNT_STATE
  - ORDER_STATE
  - POSITION_STATE
  - LEDGER_STATE
  - RECONCILIATION_STATE
  - RISK_STATE
constraints:
- Snapshots are immutable; corrupted hashes are rejected (STATE-003).
- Rebuild from a snapshot must reproduce the same state as the events it covers.
compatibility: BACKWARD
history:
- version: 1.0.0
  date: '2026-09-23'
  summary: Initial state snapshot contract (Phase 2)
  changes: []
- version: 1.1.0
  date: '2026-09-23'
  summary: 'Phase 3: RISK_STATE category (risk state transitions ride the Phase 2
    state machinery)'
  changes:
  - kind: ADDED_ENUM_VALUE
    enum: state_category
    value: RISK_STATE
