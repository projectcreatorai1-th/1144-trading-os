schema_id: state_transition
version: 1.1.0
status: ACTIVE
owner: core.state
description: 'Immutable state transition history: previous -> new with the event,
  reason, actor and versions. Never overwritten.'
python_binding: core.state.contracts:StateTransitionRecord
fields:
  transition_id:
    type: identifier
    required: true
    description: trn_ identifier
  entity_type:
    type: string
    required: true
    enum: state_category
    description: State category
  entity_id:
    type: string
    required: true
    description: Entity the state belongs to
  new_state:
    type: string
    required: true
    description: Resulting state
  previous_version:
    type: integer
    required: true
    description: Version before (0 for genesis)
  new_version:
    type: integer
    required: true
    description: Version after
  event_id:
    type: identifier
    required: true
    description: evt_ identifier that caused the transition
  reason:
    type: string
    required: true
    description: Why the transition happened
  actor:
    type: string
    required: true
    description: Which module/projector transitioned
  timestamp:
    type: timestamp
    required: true
    description: Transition time (timezone-aware)
  environment:
    type: string
    required: true
    description: Explicit environment
  correlation_id:
    type: string
    required: true
    description: Chain correlation identifier
  previous_state:
    type: string
    required: false
    description: State before (None for genesis)
enums:
  state_category:
  - SYSTEM_STATE
  - MARKET_STATE
  - DATA_STATE
  - ACCOUNT_STATE
  - ORDER_STATE
  - POSITION_STATE
  - LEDGER_STATE
  - RECONCILIATION_STATE
  - RISK_STATE
constraints:
- Machine-backed categories must transition via the Phase 0 state machine registry
  (fail closed).
- new_version == previous_version + 1.
- Transition history is append-only.
compatibility: BACKWARD
history:
- version: 1.0.0
  date: '2026-09-23'
  summary: Initial state transition contract (Phase 2)
  changes: []
- version: 1.1.0
  date: '2026-09-23'
  summary: 'Phase 3: RISK_STATE category (risk state transitions ride the Phase 2
    state machinery)'
  changes:
  - kind: ADDED_ENUM_VALUE
    enum: state_category
    value: RISK_STATE
